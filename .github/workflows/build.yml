name: Build Windows11 Virtual Machine

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # ==========================================
      # 1. DOWNLOAD REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. FIND AND EXTRACT SOURCE ZIP
      # ==========================================

      - name: Extract project ZIP
        run: |
          Write-Host "Searching for project ZIP..."

          $zipFiles = @(
            Get-ChildItem `
              -Path "." `
              -Filter "*.zip" `
              -File
          )

          if ($zipFiles.Count -eq 0) {
            throw "No ZIP archive found in repository root!"
          }

          if ($zipFiles.Count -gt 1) {
            throw "Multiple ZIP files found. Keep only the project ZIP in the repository root."
          }

          $zip = $zipFiles[0]

          Write-Host "Found ZIP: $($zip.FullName)"

          $extractPath = Join-Path $env:RUNNER_TEMP "vm-project-source"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extractPath | Out-Null

          Expand-Archive `
            -LiteralPath $zip.FullName `
            -DestinationPath $extractPath `
            -Force

          Write-Host "ZIP extracted successfully."

          Write-Host "Extracted files:"
          Get-ChildItem -Path $extractPath -Recurse |
            Select-Object FullName

          "EXTRACT_PATH=$extractPath" >> $env:GITHUB_ENV

      # ==========================================
      # 3. FIND PROJECT ROOT
      # ==========================================

      - name: Locate project files
        run: |
          Write-Host "Locating requirements.txt..."

          $requirements = @(
            Get-ChildItem `
              -Path $env:EXTRACT_PATH `
              -Filter "requirements.txt" `
              -File `
              -Recurse
          )

          if ($requirements.Count -eq 0) {
            throw "requirements.txt not found inside ZIP!"
          }

          $validProjects = @(
            $requirements | Where-Object {
              $root = $_.Directory.FullName

              (Test-Path (Join-Path $root "launcher.py")) -and
              (Test-Path (Join-Path $root "scripts\build.py")) -and
              (Test-Path (Join-Path $root "src\main.py"))
            }
          )

          if ($validProjects.Count -ne 1) {
            throw "Expected exactly one complete project inside ZIP. Found: $($validProjects.Count)"
          }

          $projectRoot = $validProjects[0].Directory.FullName

          Write-Host "Project root: $projectRoot"

          "PROJECT_ROOT=$projectRoot" >> $env:GITHUB_ENV

      # ==========================================
      # 4. SETUP PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      # ==========================================
      # 5. INSTALL PYTHON DEPENDENCIES
      # ==========================================

      - name: Install Python dependencies
        run: |
          Set-Location $env:PROJECT_ROOT

          Write-Host "Installing dependencies..."

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Python dependency installation failed"
          }

      # ==========================================
      # 6. INSTALL QEMU
      # ==========================================

      - name: Install QEMU
        run: |
          choco install qemu -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "QEMU installation failed"
          }

      # ==========================================
      # 7. LOCATE QEMU
      # ==========================================

      - name: Locate QEMU installation
        run: |
          $paths = @(
            "C:\Program Files\qemu",
            "C:\Program Files (x86)\qemu"
          )

          $found = $null

          foreach ($path in $paths) {
            if (Test-Path (Join-Path $path "qemu-system-x86_64.exe")) {
              $found = $path
              break
            }
          }

          if ($null -eq $found) {
            throw "QEMU executable not found!"
          }

          if (!(Test-Path (Join-Path $found "qemu-img.exe"))) {
            throw "qemu-img.exe not found!"
          }

          Write-Host "QEMU found: $found"

          "QEMU_PATH=$found" >> $env:GITHUB_ENV

      # ==========================================
      # 8. RUN AUTOMATIC TESTS
      # ==========================================

      - name: Run project tests
        run: |
          Set-Location $env:PROJECT_ROOT

          if (Test-Path "tests") {
            python -m unittest discover -s tests -v

            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed"
            }
          }
          else {
            throw "Tests directory not found!"
          }

      # ==========================================
      # 9. BUILD PYTHON APPLICATION
      # ==========================================

      - name: Build application
        run: |
          Set-Location $env:PROJECT_ROOT

          Write-Host "Building application..."

          python scripts/build.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed"
          }

          $exe = "dist\Windows11VirtualMachine\Windows11VirtualMachine.exe"

          if (!(Test-Path $exe)) {
            throw "Application EXE not found!"
          }

          Write-Host "Application built successfully."

      # ==========================================
      # 10. CREATE QEMU ZIP
      # ==========================================

      - name: Package QEMU into ZIP
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "qemu-windows-x64.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "$env:QEMU_PATH\*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (!(Test-Path $zipPath)) {
            throw "QEMU ZIP creation failed!"
          }

          "QEMU_ZIP=$zipPath" >> $env:GITHUB_ENV

          Write-Host "QEMU ZIP created."

      # ==========================================
      # 11. EXTRACT QEMU INTO APPLICATION
      # ==========================================

      - name: Extract QEMU ZIP into application
        run: |
          $target = Join-Path `
            $env:PROJECT_ROOT `
            "dist\Windows11VirtualMachine\qemu"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $target | Out-Null

          Expand-Archive `
            -LiteralPath $env:QEMU_ZIP `
            -DestinationPath $target `
            -Force

          Write-Host "QEMU extracted into application."

      # ==========================================
      # 12. VERIFY BUNDLED COMPONENTS
      # ==========================================

      - name: Verify application components
        run: |
          $root = Join-Path `
            $env:PROJECT_ROOT `
            "dist\Windows11VirtualMachine"

          $required = @(
            "Windows11VirtualMachine.exe",
            "qemu\qemu-system-x86_64.exe",
            "qemu\qemu-img.exe"
          )

          foreach ($file in $required) {
            $path = Join-Path $root $file

            if (!(Test-Path $path)) {
              throw "Missing required component: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host "All required files found."

      # ==========================================
      # 13. CREATE PORTABLE ZIP
      # ==========================================

      - name: Create portable ZIP
        run: |
          $source = Join-Path `
            $env:PROJECT_ROOT `
            "dist\Windows11VirtualMachine"

          $destination = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Windows11-VirtualMachine-Portable.zip"

          Compress-Archive `
            -Path "$source\*" `
            -DestinationPath $destination `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $destination)) {
            throw "Portable ZIP creation failed!"
          }

          Write-Host "Portable ZIP created."

      # ==========================================
      # 14. INSTALL INNO SETUP
      # ==========================================

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      # ==========================================
      # 15. CREATE INSTALLER CONFIGURATION
      # ==========================================

      - name: Generate installer script
        run: |
          Set-Location $env:PROJECT_ROOT

          @'
          [Setup]
          AppName=Windows11 Virtual Machine
          AppVersion=1.0.0
          DefaultDirName={autopf}\Windows11VirtualMachine
          DefaultGroupName=Windows11 Virtual Machine
          OutputDir=.
          OutputBaseFilename=Windows11-VirtualMachine-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\Windows11VirtualMachine.exe

          [Files]
          Source: "dist\Windows11VirtualMachine\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Windows11 Virtual Machine"; Filename: "{app}\Windows11VirtualMachine.exe"
          Name: "{autodesktop}\Windows11 Virtual Machine"; Filename: "{app}\Windows11VirtualMachine.exe"

          [Run]
          Filename: "{app}\Windows11VirtualMachine.exe"; Description: "Launch Windows11 Virtual Machine"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path "installer.iss" -Encoding UTF8

          Write-Host "Installer script created."

      # ==========================================
      # 16. BUILD EXE INSTALLER
      # ==========================================

      - name: Build Windows EXE installer
        run: |
          Set-Location $env:PROJECT_ROOT

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found!"
          }

          & $iscc "installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed!"
          }

          $installer = "Windows11-VirtualMachine-x64.exe"

          if (!(Test-Path $installer)) {
            throw "Installer EXE not found!"
          }

          Copy-Item `
            -Path $installer `
            -Destination $env:GITHUB_WORKSPACE `
            -Force

          Write-Host "Windows installer created."

      # ==========================================
      # 17. VERIFY FINAL RELEASE FILES
      # ==========================================

      - name: Verify release files
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          $files = @(
            "Windows11-VirtualMachine-x64.exe",
            "Windows11-VirtualMachine-Portable.zip"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Release file missing: $file"
            }

            $size = (Get-Item $file).Length / 1MB

            Write-Host "$file - $([math]::Round($size, 2)) MB"
          }

          Write-Host "Release artifacts verified."

      # ==========================================
      # 18. UPLOAD ARTIFACTS
      # ==========================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows11-VirtualMachine
          path: |
            Windows11-VirtualMachine-x64.exe
            Windows11-VirtualMachine-Portable.zip
          if-no-files-found: error

      # ==========================================
      # 19. PUBLISH GITHUB RELEASE
      # ==========================================

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Windows11 Virtual Machine ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Windows11-VirtualMachine-x64.exe
            Windows11-VirtualMachine-Portable.zip
          fail_on_unmatched_files: true
