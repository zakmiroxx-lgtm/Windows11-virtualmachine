name: Build Windows11 Virtual Machine

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # =====================================
      # DOWNLOAD SOURCE
      # =====================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================
      # EXTRACT PROJECT ZIP
      # =====================================

      - name: Extract source archive
        run: |
          $archives = @(
            Get-ChildItem -Path . -Filter "*.zip" -File
          )

          if ($archives.Count -ne 1) {
            throw "Expected exactly one source ZIP archive"
          }

          $destination = Join-Path $env:RUNNER_TEMP "source"

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          Expand-Archive `
            -LiteralPath $archives[0].FullName `
            -DestinationPath $destination `
            -Force

          $requirements = @(
            Get-ChildItem `
              -Path $destination `
              -Filter requirements.txt `
              -File `
              -Recurse
          )

          $projects = @(
            $requirements | Where-Object {
              $root = $_.Directory.FullName

              (Test-Path (Join-Path $root "launcher.py")) -and
              (Test-Path (Join-Path $root "scripts\build.py")) -and
              (Test-Path (Join-Path $root "src\main.py"))
            }
          )

          if ($projects.Count -ne 1) {
            throw "Could not uniquely identify project root"
          }

          "PROJECT_ROOT=$($projects[0].Directory.FullName)" >> $env:GITHUB_ENV

      # =====================================
      # PYTHON
      # =====================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          Set-Location $env:PROJECT_ROOT

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed"
          }

      # =====================================
      # QEMU
      # =====================================

      - name: Install QEMU
        run: |
          choco install qemu -y --no-progress --limit-output

          if ($LASTEXITCODE -ne 0) {
            throw "QEMU installation failed"
          }

      - name: Locate QEMU
        run: |
          $locations = @(
            "C:\Program Files\qemu",
            "C:\Program Files (x86)\qemu"
          )

          $found = $null

          foreach ($location in $locations) {
            if (
              (Test-Path (Join-Path $location "qemu-system-x86_64.exe")) -and
              (Test-Path (Join-Path $location "qemu-img.exe"))
            ) {
              $found = $location
              break
            }
          }

          if (!$found) {
            throw "QEMU not found"
          }

          "QEMU_PATH=$found" >> $env:GITHUB_ENV

      # =====================================
      # TESTS
      # =====================================

      - name: Run tests
        run: |
          Set-Location $env:PROJECT_ROOT

          python -m unittest discover -s tests -v

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed"
          }

      # =====================================
      # BUILD
      # =====================================

      - name: Build application
        run: |
          Set-Location $env:PROJECT_ROOT

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --noupx `
            --name Windows11VirtualMachine `
            --paths . `
            launcher.py

          if ($LASTEXITCODE -ne 0) {
            throw "Application build failed"
          }

      # =====================================
      # BUNDLE QEMU
      # =====================================

      - name: Bundle QEMU
        run: |
          $target = Join-Path `
            $env:PROJECT_ROOT `
            "dist\Windows11VirtualMachine\qemu"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item `
            -Path "$env:QEMU_PATH\*" `
            -Destination $target `
            -Recurse `
            -Force

      # =====================================
      # VERIFY BUILD
      # =====================================

      - name: Verify required files
        run: |
          $root = Join-Path `
            $env:PROJECT_ROOT `
            "dist\Windows11VirtualMachine"

          $required = @(
            "Windows11VirtualMachine.exe",
            "qemu\qemu-system-x86_64.exe",
            "qemu\qemu-img.exe"
          )

          foreach ($file in $required) {
            $path = Join-Path $root $file

            if (!(Test-Path $path)) {
              throw "Missing component: $file"
            }
          }

          "PACKAGE_ROOT=$root" >> $env:GITHUB_ENV

      # =====================================
      # WINDOWS DEFENDER SCAN
      # =====================================

      - name: Scan application with Microsoft Defender
        run: |
          $defender = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"

          if (!(Test-Path $defender)) {
            throw "Microsoft Defender scanner unavailable"
          }

          & $defender `
            -Scan `
            -ScanType 3 `
            -File $env:PACKAGE_ROOT

          if ($LASTEXITCODE -ne 0) {
            throw "Defender scan failed or detected a threat"
          }

      # =====================================
      # PORTABLE PACKAGE
      # =====================================

      - name: Create portable ZIP
        run: |
          $destination = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Windows11-VirtualMachine-Portable.zip"

          Compress-Archive `
            -Path "$env:PACKAGE_ROOT\*" `
            -DestinationPath $destination `
            -CompressionLevel Optimal `
            -Force

      # =====================================
      # INNO SETUP
      # =====================================

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      - name: Create installer configuration
        run: |
          Set-Location $env:PROJECT_ROOT

          @'
          [Setup]
          AppId=Windows11VirtualMachine
          AppName=Windows11 Virtual Machine
          AppVersion=1.0.0
          AppPublisher=Windows11 Virtual Machine Contributors
          DefaultDirName={autopf}\Windows11VirtualMachine
          DefaultGroupName=Windows11 Virtual Machine
          OutputDir=.
          OutputBaseFilename=Windows11-VirtualMachine-x64
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\Windows11VirtualMachine.exe
          PrivilegesRequired=lowest

          [Files]
          Source: "dist\Windows11VirtualMachine\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Windows11 Virtual Machine"; Filename: "{app}\Windows11VirtualMachine.exe"
          Name: "{autodesktop}\Windows11 Virtual Machine"; Filename: "{app}\Windows11VirtualMachine.exe"; Tasks: desktopicon

          [Tasks]
          Name: desktopicon; Description: "Create desktop shortcut"; GroupDescription: "Additional icons:"
          '@ | Set-Content installer.iss -Encoding UTF8

      # =====================================
      # CREATE INSTALLER
      # =====================================

      - name: Build installer
        run: |
          Set-Location $env:PROJECT_ROOT

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $compiler)) {
            throw "Inno Setup compiler missing"
          }

          & $compiler installer.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

          Copy-Item `
            "Windows11-VirtualMachine-x64.exe" `
            $env:GITHUB_WORKSPACE `
            -Force

      # =====================================
      # SCAN FINAL INSTALLER
      # =====================================

      - name: Scan final installer
        run: |
          $installer = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Windows11-VirtualMachine-x64.exe"

          $defender = Join-Path `
            $env:ProgramFiles `
            "Windows Defender\MpCmdRun.exe"

          & $defender `
            -Scan `
            -ScanType 3 `
            -File $installer

          if ($LASTEXITCODE -ne 0) {
            throw "Final installer failed security scan"
          }

      # =====================================
      # SHA256 CHECKSUMS
      # =====================================

      - name: Generate SHA256 checksums
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          $files = @(
            "Windows11-VirtualMachine-x64.exe",
            "Windows11-VirtualMachine-Portable.zip"
          )

          $checksums = foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing artifact: $file"
            }

            $hash = Get-FileHash `
              -Path $file `
              -Algorithm SHA256

            "$($hash.Hash.ToLower())  $file"
          }

          $checksums | Set-Content `
            -Path "SHA256SUMS.txt" `
            -Encoding ascii

          Get-Content SHA256SUMS.txt

      # =====================================
      # UPLOAD ARTIFACTS
      # =====================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows11-VirtualMachine
          path: |
            Windows11-VirtualMachine-x64.exe
            Windows11-VirtualMachine-Portable.zip
            SHA256SUMS.txt
          if-no-files-found: error

      # =====================================
      # GITHUB RELEASE
      # =====================================

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Windows11-VirtualMachine-x64.exe
            Windows11-VirtualMachine-Portable.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
